<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Famille Sanderet de Valonne</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@600&family=IBM+Plex+Sans:wght@400;600&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>

:root{
  /* Archive viewer: photo of the original on the left, reading on the right */
  --paper:#f4f5f2; --card:#ffffff; --ink:#1d2326; --muted:#5d686d;
  --accent:#2b5869; --doubt:#8a5a00; --doubt-bg:#fff3d6; --line:#d9dedc;
  --display:"Cormorant SC","Cormorant Garamond",Georgia,serif;
  --body:"Source Serif 4",Georgia,"Times New Roman",serif;
  --ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#151a1c; --card:#1e2528; --ink:#e7ebe9; --muted:#9aa7ab;
  --accent:#7fb3c4; --doubt:#f0c36a; --doubt-bg:#3a2f14; --line:#334044; color-scheme:dark;}}
:root[data-theme="dark"]{
  --paper:#151a1c; --card:#1e2528; --ink:#e7ebe9; --muted:#9aa7ab;
  --accent:#7fb3c4; --doubt:#f0c36a; --doubt-bg:#3a2f14; --line:#334044; color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6}
.wrap{max-width:1180px;margin:0 auto;padding:32px 20px 80px}
header.top{display:grid;gap:10px;padding-bottom:22px;border-bottom:1px solid var(--line);margin-bottom:28px}
.eyebrow{font-family:var(--ui);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600}
h1{font-family:var(--display);font-weight:600;font-size:clamp(30px,4.4vw,46px);line-height:1.1;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-weight:600;font-size:28px;margin:0 0 12px;text-wrap:balance}
h3{font-family:var(--ui);font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:600}
.lede{max-width:70ch;color:var(--ink);margin:0}
dl.meta{display:grid;grid-template-columns:max-content 1fr;gap:6px 18px;font-family:var(--ui);font-size:14.5px;margin:6px 0 0}
dl.meta dt{color:var(--muted)} dl.meta dd{margin:0}
.notice{font-family:var(--ui);font-size:14.5px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);padding:14px 16px;border-radius:6px;max-width:80ch}
.notice p{margin:0 0 6px}.notice p:last-child{margin:0}
section.block{margin:34px 0}
.photo-block{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:28px;align-items:start;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:20px}
.photo-block figure{margin:0;position:sticky;top:16px}
.photo-block img{width:100%;height:auto;display:block;border-radius:4px;cursor:zoom-in;border:1px solid var(--line)}
figcaption{font-family:var(--ui);font-size:13px;color:var(--muted);margin-top:8px}
.part{padding:0 0 18px;margin:0 0 18px;border-bottom:1px dashed var(--line)}
.part:last-child{border-bottom:0;margin-bottom:0;padding-bottom:0}
.where{font-family:var(--ui);font-size:13px;color:var(--accent);font-weight:600;margin:0 0 6px;display:flex;gap:8px;flex-wrap:wrap;align-items:baseline}
.where .order{background:var(--accent);color:var(--card);border-radius:20px;padding:1px 9px;font-size:12px}
.tr p{margin:0 0 10px;max-width:68ch}
.tr .item{padding-left:14px;border-left:2px solid var(--line)}
.q{background:var(--doubt-bg);color:var(--doubt);font-family:var(--ui);font-size:.82em;font-weight:600;padding:0 4px;border-radius:3px;white-space:nowrap}
.cont{font-family:var(--ui);font-size:13px;color:var(--muted);font-style:italic}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:22px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:18px 20px}
.panel ul{margin:0;padding-left:20px}.panel li{margin:0 0 6px}
.panel p{margin:0 0 8px}
table{border-collapse:collapse;width:100%;font-family:var(--ui);font-size:14.5px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600}
td.num{font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}
a{color:var(--accent)} a:focus-visible,img:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.legend{font-family:var(--ui);font-size:13.5px;color:var(--muted)}
#lb{position:fixed;inset:0;background:rgba(10,12,13,.92);display:none;overflow:auto;z-index:10}
#lb.on{display:block}
#lb img{display:block;max-width:none;width:min(2000px,180vw);margin:0 auto;cursor:zoom-out}
#lb button{position:fixed;top:12px;right:12px;font-family:var(--ui);font-size:15px;padding:8px 14px;border-radius:6px;border:0;background:#fff;color:#111;cursor:pointer}
footer{margin-top:50px;font-family:var(--ui);font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
@media (max-width:820px){.photo-block{grid-template-columns:1fr}.photo-block figure{position:static}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}

:root{--warm:#a0522d;--gold:#b8860b;--tile:#ffffff;--scale:1}
html{font-size:calc(18px * var(--scale))}
body{font-size:1rem}
.app{min-height:100vh}
button{font:inherit}
.btn{display:inline-flex;align-items:center;gap:8px;font-family:var(--ui);font-size:1rem;font-weight:600;padding:12px 20px;border-radius:10px;border:2px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;min-height:48px}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:focus-visible,.chip:focus-visible,.tile:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 30% 20%,color-mix(in srgb,var(--accent) 18%,var(--paper)),var(--paper) 60%)}
.login form{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:32px 28px;width:min(420px,100%);display:grid;gap:16px;box-shadow:0 10px 40px rgba(0,0,0,.08)}
.login h1{font-size:2.1rem;text-align:center}.login p{margin:0;text-align:center;color:var(--muted)}
.login label{font-family:var(--ui);font-weight:600;display:grid;gap:6px}
.login input[type=text],.login input[type=password]{font:inherit;font-size:1.15rem;padding:12px 14px;border:2px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink)}
.login input:focus{border-color:var(--accent);outline:none}
.login .err{color:#b3261e;font-family:var(--ui);font-weight:600;text-align:center;min-height:1.4em}
.login .remember{display:flex;gap:10px;align-items:center;font-weight:400}
.seal{width:72px;height:72px;margin:0 auto;border-radius:50%;background:var(--warm);color:#fff;display:grid;place-items:center;font-family:var(--display);font-size:2rem;box-shadow:inset 0 0 0 4px rgba(255,255,255,.25)}
/* top bar */
.bar{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
.bar .in{max-width:1180px;margin:0 auto;padding:8px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bar .brand{font-family:var(--display);font-size:1.4rem;font-weight:600;color:var(--ink);text-decoration:none;margin-right:auto;cursor:pointer}
.bar nav{display:flex;gap:4px;flex-wrap:wrap}
.bar nav a{font-family:var(--ui);color:var(--muted);text-decoration:none;padding:10px 12px;border-radius:8px;font-size:.95rem}
.bar nav a.on{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--ink);font-weight:600}
.sizer{display:flex;gap:4px}.sizer button{font-family:var(--ui);width:44px;height:44px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;font-weight:600}
main.view{max-width:1180px;margin:0 auto;padding:24px 16px 80px}
/* home */
.hero{display:grid;gap:10px;padding:16px 0 24px}
.hero h1{font-size:clamp(2rem,5vw,3.2rem)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.tile{display:grid;gap:8px;background:var(--tile);border:1px solid var(--line);border-radius:14px;padding:22px;text-decoration:none;color:var(--ink);cursor:pointer;transition:transform .15s,box-shadow .15s;text-align:left}
.tile:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.08)}
.tile .ico{font-size:2.2rem}.tile h2{font-size:1.6rem;margin:0}.tile p{margin:0;color:var(--muted);font-size:.95rem}
.fact{margin-top:24px;background:color-mix(in srgb,var(--gold) 12%,var(--card));border:1px solid color-mix(in srgb,var(--gold) 40%,var(--line));border-radius:14px;padding:18px 20px;display:flex;gap:14px;align-items:flex-start}
.fact .ico{font-size:1.8rem}.fact p{margin:4px 0 0}
/* history */
.reader{max-width:760px;margin:0 auto}
.reader .prog{display:flex;gap:6px;margin:8px 0 18px;flex-wrap:wrap}
.reader .prog button{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:var(--card);color:var(--ink);font-family:var(--ui);font-weight:600;cursor:pointer}
.reader .prog button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.reader article{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:26px 24px;line-height:1.75}
.reader article h2{font-size:2rem}.reader article p{margin:0 0 16px}
.reader .nav{display:flex;justify-content:space-between;gap:12px;margin-top:18px;flex-wrap:wrap}
/* tree */
.treewrap{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;overflow-x:auto}
.treewrap svg{min-width:720px;width:100%;height:auto;display:block}
.tbox rect{fill:var(--card);stroke:var(--muted);stroke-width:1.4;transition:fill .15s}
.tbox{cursor:pointer}.tbox:hover rect,.tbox:focus rect{fill:color-mix(in srgb,var(--accent) 16%,var(--card));stroke:var(--accent)}
.tbox.main rect{fill:color-mix(in srgb,var(--accent) 14%,var(--card));stroke:var(--accent);stroke-width:2.4}
.tbox text{font-family:var(--ui);pointer-events:none}.tn{fill:var(--ink);font-weight:600;font-size:12px}.tt{fill:var(--muted);font-size:11px}
.tl{fill:none;stroke:var(--muted);stroke-width:1.3}.tl.d{stroke-dasharray:5 4}
.hint{color:var(--muted);font-family:var(--ui);font-size:.95rem;margin:10px 0}
/* drawer */
.overlay{position:fixed;inset:0;background:rgba(20,22,24,.45);z-index:40;display:none}
.overlay.on{display:block}
.drawer{position:fixed;right:0;top:0;bottom:0;width:min(460px,100%);background:var(--card);z-index:41;padding:24px;overflow:auto;transform:translateX(100%);transition:transform .25s;box-shadow:-10px 0 30px rgba(0,0,0,.15)}
.drawer.on{transform:none}
.drawer h2{font-size:1.9rem;margin:6px 0}.drawer .years{font-family:var(--ui);color:var(--muted)}
.badge{display:inline-block;font-family:var(--ui);font-size:.8rem;font-weight:600;border-radius:20px;padding:3px 10px}
.badge.ok{background:color-mix(in srgb,#2e7d32 15%,transparent);color:#2e7d32}.badge.maybe{background:color-mix(in srgb,var(--gold) 20%,transparent);color:#8a6100}
.close{position:absolute;right:14px;top:14px;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-size:1.3rem;cursor:pointer}
.doclinks{display:grid;gap:8px;margin-top:16px}
/* timeline */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 20px}
.chip{font-family:var(--ui);font-size:.95rem;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:30px;padding:8px 16px;cursor:pointer;min-height:44px}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tline{position:relative;margin-left:16px;border-left:3px solid color-mix(in srgb,var(--accent) 40%,var(--line));padding-left:26px;display:grid;gap:18px}
.ev{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 18px;cursor:pointer;text-align:left;color:var(--ink);font:inherit}
.ev:hover{border-color:var(--accent)}
.ev::before{content:"";position:absolute;left:-37px;top:20px;width:18px;height:18px;border-radius:50%;background:var(--accent);border:3px solid var(--paper)}
.ev .y{font-family:var(--display);font-size:1.6rem;color:var(--accent);line-height:1}.ev h3{margin:4px 0;font-family:var(--body);font-size:1.15rem;text-transform:none;letter-spacing:0;color:var(--ink)}.ev p{margin:0;color:var(--muted)}
/* documents */
.search{font:inherit;width:100%;padding:12px 16px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-size:1.05rem;margin-bottom:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.dcard{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;text-align:left;padding:0;color:var(--ink);display:flex;flex-direction:column}
.dcard:hover{border-color:var(--accent);box-shadow:0 6px 20px rgba(0,0,0,.08)}
.dcard .ph{height:150px;background:var(--line) center/cover no-repeat}
.dcard .tx{padding:12px 14px;display:grid;gap:4px}.dcard .pd{font-family:var(--ui);font-size:.85rem;color:var(--accent);font-weight:600}.dcard .ti{font-weight:600;font-size:1.05rem;line-height:1.3}.dcard .np{font-family:var(--ui);font-size:.82rem;color:var(--muted)}
.docview .back{margin-bottom:14px}
.docview img{cursor:zoom-in}
/* lightbox */
.lb{position:fixed;inset:0;background:rgba(10,12,13,.94);z-index:60;display:none;flex-direction:column}
.lb.on{display:flex}.lb .tools{display:flex;gap:8px;justify-content:flex-end;padding:10px}
.lb .tools button{font-family:var(--ui);font-size:1rem;min-width:48px;height:48px;border-radius:10px;border:0;background:#fff;color:#111;cursor:pointer;padding:0 14px;font-weight:600}
.lb .stage{flex:1;overflow:auto;display:grid;place-items:start center}
.lb img{transform-origin:top center;max-width:none}
.loading{display:grid;place-items:center;min-height:60vh;font-family:var(--ui);color:var(--muted)}
@media (max-width:640px){.bar nav a{padding:8px 8px;font-size:.88rem}.reader article{padding:18px 16px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* thème patrimoine */
:root,:root[data-theme],:root:not([data-theme="light"]){--paper:#ece3d0!important;--card:#f6efdf!important;--tile:#f6efdf!important;--ink:#2a2118!important;--muted:#6b5a45!important;--accent:#7a2e2e!important;--line:#d6c7a8!important;--doubt:#7a5200!important;--doubt-bg:#f3e2b5!important;--gold:#a8873a!important;color-scheme:light}
@media (prefers-color-scheme: dark){:root,:root:not([data-theme="light"]){--paper:#ece3d0!important;--card:#f6efdf!important;--ink:#2a2118!important;--muted:#6b5a45!important;--accent:#7a2e2e!important;--line:#d6c7a8!important;color-scheme:light}}
body{background:var(--paper);background-image:radial-gradient(rgba(122,46,46,.035) 1px,transparent 1px);background-size:4px 4px}
.bar{background:#2b1d16;border-bottom:3px solid var(--gold)}
.bar .brand{color:#f3e7cc}.bar nav a{color:#d9c8a6}.bar nav a.on{background:rgba(168,135,58,.22);color:#fff}
.sizer button{background:transparent;color:#f3e7cc;border-color:rgba(243,231,204,.35)}
.btn{border-radius:4px}.btn.ghost{background:transparent}
.hero{background:#2b1d16;color:#f3e7cc;margin:-24px -16px 28px;padding:56px 32px 48px;border-bottom:3px solid var(--gold)}
.hero h1{color:#f6ecd6}.hero .lede{color:#e3d4b5}.hero .eyebrow{color:var(--gold)}
.tile{border-radius:4px;border-top:4px solid var(--accent);background:var(--card)}
.tile .num{font-family:var(--display);font-size:2.4rem;color:var(--gold);line-height:1}
.tile h2{font-family:var(--display);font-weight:600}
.fact{border-radius:4px;border-left:4px solid var(--gold);background:var(--card)}
.fact .label{font-family:var(--ui);font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);font-weight:600}
.reader article,.treewrap,.dcard,.ev,article.doc,.panel,.photo-block,.toc,.notice{border-radius:4px!important}
.login{background:#2b1d16;background-image:radial-gradient(circle at 50% 30%,#4a2e22,#2b1d16 70%)}
.login form{border-radius:4px;border-top:4px solid var(--gold)}
.seal{background:var(--accent);border-radius:50%;box-shadow:0 0 0 3px var(--gold)}
.chip{border-radius:4px}.dcard .ph{filter:sepia(.15)}
.drawer{background:var(--card);border-left:3px solid var(--gold)}
</style></head>
<body>
<div id="app" class="app"></div>
<div id="ov" class="overlay"></div><aside id="dr" class="drawer" aria-live="polite"></aside>
<div id="lbx" class="lb" role="dialog" aria-label="Photo agrandie"><div class="tools"><button id="zo" aria-label="Dézoomer">−</button><button id="zi" aria-label="Zoomer">+</button><button id="lbc">Fermer ✕</button></div><div class="stage"><img id="lbi" alt=""></div></div>
<script>
const META={"salt": "NUFb43QOjlWhHIpK61r1bQ==", "iter": 310000};
const $=s=>document.querySelector(s), app=$('#app');
let KEY=null, D=null; const blobs={};
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const store={get(k){try{return sessionStorage.getItem(k)||localStorage.getItem(k)}catch(e){return null}},set(k,v,keep){try{(keep?localStorage:sessionStorage).setItem(k,v)}catch(e){}},clear(){try{sessionStorage.clear();localStorage.removeItem('sk')}catch(e){}}};
async function derive(u,c){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(u.trim()+'\n'+c.trim()),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(META.salt),iterations:META.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt']);}
async function dec(buf){const b=new Uint8Array(buf);return crypto.subtle.decrypt({name:'AES-GCM',iv:b.slice(0,12)},KEY,b.slice(12));}
async function load(){const r=await fetch('c/data.bin');D=JSON.parse(new TextDecoder().decode(await dec(await r.arrayBuffer())));}
async function img(id){if(!blobs[id]){blobs[id]=fetch('c/'+id+'.bin').then(r=>r.arrayBuffer()).then(dec).then(p=>URL.createObjectURL(new Blob([p],{type:'image/jpeg'})));}return blobs[id];}
const io='IntersectionObserver' in window?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){io.unobserve(e.target);paint(e.target)}}),{rootMargin:'300px'}):null;
async function paint(el){const id=el.dataset.enc||el.dataset.bg;const u=await img(id);if(el.dataset.bg)el.style.backgroundImage=`url(${u})`;else el.src=u;}
function hydrate(root){root.querySelectorAll('[data-enc],[data-bg]').forEach(el=>io?io.observe(el):paint(el));}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- login */
function loginView(msg=''){app.innerHTML=`<div class="login"><form id="lf" autocomplete="on"><div class="seal">S</div><h1>Famille Sanderet de Valonne</h1><p>Espace réservé à la famille</p>
<label for="u">Identifiant<input id="u" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
<label for="c">Code<input id="c" type="password" inputmode="numeric" autocomplete="current-password" required></label>
<label class="remember"><input id="k" type="checkbox"> Rester connecté sur cet appareil</label>
<button class="btn" type="submit" id="go">Entrer</button><div class="err" id="er">${esc(msg)}</div></form></div>`;
$('#u').focus();$('#lf').addEventListener('submit',async e=>{e.preventDefault();$('#go').disabled=true;$('#er').textContent='Ouverture…';
try{KEY=await derive($('#u').value,$('#c').value);await load();const raw=await crypto.subtle.exportKey('raw',KEY);store.set('sk',btoa(String.fromCharCode(...new Uint8Array(raw))),$('#k').checked);start();}
catch(err){KEY=null;$('#go').disabled=false;$('#er').textContent='Identifiant ou code incorrect. Réessayez.';}});}

/* ---------- shell */
const NAV=[['accueil','Accueil'],['histoire','Histoire'],['arbre','Arbre'],['frise','Frise'],['documents','Documents']];
function shell(){app.innerHTML=`<header class="bar"><div class="in"><a class="brand" data-go="accueil">Famille Sanderet</a><nav>${NAV.map(([k,t])=>`<a href="#${k}" data-nav="${k}">${t}</a>`).join('')}</nav><div class="sizer"><button id="sm" aria-label="Texte plus petit">A−</button><button id="bg" aria-label="Texte plus grand">A+</button><button id="out" aria-label="Se déconnecter" style="width:auto;padding:0 12px">Quitter</button></div></div></header><main class="view" id="v"></main>`;
let sc=parseFloat(store.get('scale')||'1');const setS=v=>{sc=Math.min(1.5,Math.max(.85,v));document.documentElement.style.setProperty('--scale',sc);try{localStorage.setItem('scale',sc)}catch(e){}};setS(sc);
$('#sm').onclick=()=>setS(sc-.1);$('#bg').onclick=()=>setS(sc+.1);$('#out').onclick=()=>{store.clear();KEY=null;D=null;location.hash='';loginView('Vous êtes déconnecté.');};
$('.brand').onclick=()=>location.hash='accueil';}
function route(){if(!D)return;const [r,a]=(location.hash.slice(1)||'accueil').split('/');document.querySelectorAll('[data-nav]').forEach(x=>x.classList.toggle('on',x.dataset.nav===r||(r==='doc'&&x.dataset.nav==='documents')));
const v=$('#v');window.scrollTo(0,0);closeDrawer();$('#lbx').classList.remove('on');({accueil:home,histoire:history,arbre:tree,frise:frise,documents:docs,doc:doc}[r]||home)(v,a);}
function start(){shell();addEventListener('hashchange',route);route();}

/* ---------- home */
function home(v){const f=D.events[Math.floor(Math.random()*D.events.length)];
v.innerHTML=`<section class="hero"><div class="eyebrow">Notre histoire de famille · 1526–2008</div><h1>Bienvenue chez les Sanderet</h1><p class="lede">Des vignes de Vuillafans, dans la vallée de la Loue, jusqu'à Paris et l'Artois : plus de trois siècles de vie de famille, racontés à partir des vieux papiers conservés dans une boîte.</p></section>
<section class="tiles">
<a class="tile" href="#histoire"><span class="num">I</span><h2>L'histoire</h2><p>Le récit de la famille, chapitre par chapitre.</p></a>
<a class="tile" href="#arbre"><span class="num">II</span><h2>L'arbre</h2><p>Cliquez sur une personne pour découvrir sa vie.</p></a>
<a class="tile" href="#frise"><span class="num">III</span><h2>La frise</h2><p>Les grandes dates, de 1526 à 1878.</p></a>
<a class="tile" href="#documents"><span class="num">IV</span><h2>Les documents</h2><p>Les photos des papiers et leur transcription.</p></a></section>
<div class="fact"><div><span class="label">Le saviez-vous</span><br><strong>En ${f.y}</strong><p>${esc(f.x)}</p></div></div>`;}

/* ---------- history */
function history(v,a){const n=Math.max(0,Math.min(D.chapters.length-1,parseInt(a||'0')||0)),c=D.chapters[n];
v.innerHTML=`<div class="reader"><div class="eyebrow">L'histoire · chapitre ${n+1} sur ${D.chapters.length}</div><div class="prog">${D.chapters.map((x,i)=>`<button class="${i===n?'on':''}" data-i="${i}" title="${esc(x.title)}" aria-label="Chapitre ${i+1} : ${esc(x.title)}">${i+1}</button>`).join('')}</div>
<article><h2>${c.title}</h2>${c.html}</article><div class="nav">${n>0?`<a class="btn ghost" href="#histoire/${n-1}">← ${esc(D.chapters[n-1].title.split('(')[0])}</a>`:'<span></span>'}${n<D.chapters.length-1?`<a class="btn" href="#histoire/${n+1}">${esc(D.chapters[n+1].title.split('(')[0])} →</a>`:`<a class="btn" href="#arbre">Voir l'arbre →</a>`}</div></div>`;
v.querySelectorAll('.prog button').forEach(b=>b.onclick=()=>location.hash='histoire/'+b.dataset.i);}

/* ---------- tree */
const POS={cf:[20,60,220],petit:[280,60,220],pm:[150,160,200],bailly:[520,160,220],cfse:[20,260,170],jb:[210,260,300],tfx:[20,370,170],hfb:[200,370,170],gab:[380,370,170],chf:[560,370,170],gus:[20,480,170],edj:[200,480,170],adele:[380,480,170],cj:[560,480,170],ej47:[20,590,200],ae:[240,590,260],mc:[520,590,220],leon:[205,700,330],charles:[205,800,330],sgt:[560,750,180]};
function tree(v){const by=Object.fromEntries(D.people.map(p=>[p.id,p]));
const solid=["M250 222V245H105V260M250 245H300V260","M630 222V250H470V260","M360 322V352M105 352V370","M645 432V462M105 462V480M465 462V480M645 462V480","M645 542V572M370 572V590"];
const dash=["M130 122V145H220V160","M390 122V145H280V160","M285 352V370M465 352V370M645 352V370","M285 462V480","M120 572V590M630 572V590","M370 652V700M370 762V800"];
const sh=(s,n)=>s.length>n?s.slice(0,n-1)+'…':s;
let svg=`<svg viewBox="0 0 760 880" role="group" aria-label="Arbre généalogique interactif">`+`<path class="tl" d="M105 352H645M105 462H645M120 572H630" style="stroke:var(--line)"/>`+solid.map(d=>`<path class="tl" d="${d}"/>`).join('')+dash.map(d=>`<path class="tl d" d="${d}"/>`).join('');
for(const [id,[x,y,w]] of Object.entries(POS)){const p=by[id];const c=Math.floor((w-20)/6.6);svg+=`<g class="tbox${id==='jb'?' main':''}" tabindex="0" role="button" data-p="${id}" aria-label="${esc(p.name)}"><rect x="${x}" y="${y}" width="${w}" height="62" rx="10"/><text class="tn" x="${x+12}" y="${y+21}">${esc(sh(p.name.replace(' Sanderet de Valonne','').replace(' de Peseux',''),c))}</text><text class="tt" x="${x+12}" y="${y+38}">${esc(sh(p.years,c+4))}</text><text class="tt" x="${x+12}" y="${y+54}">${esc(sh(p.sp||p.role,c+4))}</text></g>`;}
svg+=`<text class="tt" x="560" y="740" style="font-family:var(--ui)">Branche d'Arras (lien inconnu)</text><line class="tl" x1="20" y1="860" x2="60" y2="860"/><text class="tt" x="68" y="864">lien prouvé par un papier</text><line class="tl d" x1="260" y1="860" x2="300" y2="860"/><text class="tt" x="308" y="864">lien probable ou trouvé sur Geneanet</text></svg>`;
v.innerHTML=`<div class="eyebrow">L'arbre</div><h1>Qui est qui ?</h1><p class="hint">Cliquez sur une personne pour lire sa vie et voir ses documents. Sur téléphone, faites glisser l'arbre de côté.</p><div class="treewrap">${svg}</div>`;
v.querySelectorAll('.tbox').forEach(g=>{g.onclick=()=>person(g.dataset.p);g.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();person(g.dataset.p)}}});}
function person(id){const p=D.people.find(x=>x.id===id),dd=D.docs;
$('#dr').innerHTML=`<button class="close" id="dc" aria-label="Fermer">✕</button><span class="badge ${p.sure?'ok':'maybe'}">${p.sure?'Attesté par les papiers':'En partie supposé'}</span><h2>${esc(p.name)}</h2><div class="years">${esc(p.years)}</div><p><strong>${esc(p.role)}</strong>${p.sp?' · '+esc(p.sp):''}</p><p>${esc(p.bio)}</p>${p.docs.length?`<h3>Ses documents</h3><div class="doclinks">${p.docs.map(d=>{const o=dd.find(x=>x.id===d);return `<a class="btn ghost" href="#doc/${d}">${esc(o.title)}</a>`}).join('')}</div>`:'<p class="hint">Pas de document dans la boîte pour cette personne.</p>'}`;
$('#dr').classList.add('on');$('#ov').classList.add('on');$('#dc').onclick=closeDrawer;$('#dc').focus();}
function closeDrawer(){$('#dr').classList.remove('on');$('#ov').classList.remove('on');}
$('#ov').onclick=closeDrawer;

/* ---------- timeline */
let fcent='all';
function frise(v){const cents=[['all','Tout'],['16','1500'],['17','1600'],['18','1700'],['19','1800']];
const list=D.events.filter(e=>fcent==='all'||String(e.y).slice(0,2)===fcent);
v.innerHTML=`<div class="eyebrow">La frise</div><h1>Les grandes dates</h1><div class="chips">${cents.map(([k,t])=>`<button class="chip${k===fcent?' on':''}" data-c="${k}">${t}</button>`).join('')}</div><div class="tline">${list.map(e=>`<button class="ev" data-d="${e.d}"><div class="y">${e.y}</div><h3>${esc(e.t)}</h3><p>${esc(e.x)}</p></button>`).join('')}</div>`;
v.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{fcent=b.dataset.c;frise(v)});v.querySelectorAll('.ev').forEach(b=>b.onclick=()=>location.hash='doc/'+b.dataset.d);}

/* ---------- documents */
let dcat='all',dq='';
function docs(v){const cats=[['all','Tout'],['famille','Famille'],['terres','Terres et maisons'],['argent','Argent et dettes'],['armee','Armée'],['acte','Actes anciens']];
v.innerHTML=`<div class="eyebrow">Les documents</div><h1>Les papiers de la boîte</h1><input class="search" id="q" type="search" placeholder="Chercher un nom, un lieu, une date…" value="${esc(dq)}" aria-label="Chercher"><div class="chips">${cats.map(([k,t])=>`<button class="chip${k===dcat?' on':''}" data-c="${k}">${t}</button>`).join('')}</div><div class="grid" id="gr"></div>`;
const draw=()=>{const q=dq.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');const L=D.docs.filter(d=>(dcat==='all'||d.cat===dcat)&&(!q||(d.title+' '+d.period+' '+d.html.replace(/<[^>]+>/g,' ')).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').includes(q)));
$('#gr').innerHTML=L.length?L.map(d=>`<button class="dcard" data-d="${d.id}"><div class="ph" ${d.cover?`data-bg="${d.cover}"`:''}></div><div class="tx"><span class="pd">${esc(d.period)}</span><span class="ti">${esc(d.title)}</span><span class="np">${d.n} photo${d.n>1?'s':''}</span></div></button>`).join(''):'<p class="hint">Aucun document ne correspond.</p>';
$('#gr').querySelectorAll('.dcard').forEach(b=>b.onclick=()=>location.hash='doc/'+b.dataset.d);hydrate($('#gr'));};
$('#q').oninput=e=>{dq=e.target.value;draw()};v.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{dcat=b.dataset.c;v.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===b));draw()});draw();}
function doc(v,id){const d=D.docs.find(x=>x.id===id);if(!d)return docs(v);
v.innerHTML=`<div class="docview"><a class="btn ghost back" href="#documents">← Tous les documents</a>${d.html}</div>`;hydrate(v);
v.querySelectorAll('[data-jump]').forEach(a=>a.onclick=()=>document.getElementById(a.dataset.jump)?.scrollIntoView({behavior:'smooth'}));
v.querySelectorAll('img[data-enc]').forEach(i=>i.onclick=async()=>openLB(await img(i.dataset.enc),i.alt));}
let z=1;function openLB(u,alt){const i=$('#lbi');i.src=u;i.alt=alt||'';z=1;fit();$('#lbx').classList.add('on');$('#lbc').focus();}
function fit(){const i=$('#lbi');i.style.width=Math.round(Math.min(innerWidth-20,1400)*z)+'px';}
$('#zi').onclick=()=>{z=Math.min(4,z+.5);fit()};$('#zo').onclick=()=>{z=Math.max(.5,z-.5);fit()};$('#lbc').onclick=()=>$('#lbx').classList.remove('on');
addEventListener('keydown',e=>{if(e.key==='Escape'){$('#lbx').classList.remove('on');closeDrawer();}});

/* ---------- boot */
(async()=>{if(!window.crypto||!crypto.subtle){app.innerHTML='<div class="loading">Ce navigateur est trop ancien pour ouvrir le site. Essayez avec Chrome, Firefox, Safari ou Edge à jour.</div>';return;}
const sk=store.get('sk');if(sk){app.innerHTML='<div class="loading">Ouverture…</div>';try{KEY=await crypto.subtle.importKey('raw',b64(sk),'AES-GCM',false,['decrypt']);await load();return start();}catch(e){store.clear();KEY=null;}}loginView();})();
</script></body></html>
